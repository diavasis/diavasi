[workspace]
resolver = "2"
members = [
    "crates/diavasi-core",
    "crates/diavasi",
    "crates/diavasi-adapter-postgres",
    "crates/diavasi-adapter-mongodb",
    "crates/diavasi-adapter-redis",
    "crates/diavasi-adapter-scylla",
    "crates/diavasi-bench",
]
default-members = ["crates/diavasi-core", "crates/diavasi"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/diavasis/diavasi"
rust-version = "1.85"

[workspace.dependencies]
diavasi = { package = "diavasi-core", version = "0.12.0", path = "crates/diavasi-core", default-features = false }
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tonic = "0.12"
tonic-build = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = { version = "0.13", default-features = false }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = "0.13"
hdrhistogram = "7"
sysinfo = "0.33"
proptest = "1"
wtransport = "0.7"
redb = "2.6"
chacha20poly1305 = "0.10"
hex = "0.4"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
http-body-util = "0.1"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
webpki-roots = "0.26"
diavasi-adapter-postgres = { version = "0.12.0", path = "crates/diavasi-adapter-postgres" }
diavasi-adapter-mongodb = { version = "0.12.0", path = "crates/diavasi-adapter-mongodb" }
diavasi-adapter-redis = { version = "0.12.0", path = "crates/diavasi-adapter-redis" }
diavasi-adapter-scylla = { version = "0.12.0", path = "crates/diavasi-adapter-scylla" }
