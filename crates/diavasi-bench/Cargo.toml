[package]
name = "diavasi-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "End-to-end benchmark for Diavasi over PostgreSQL. Not published."
publish = false

[[bin]]
name = "diavasi-e2e-bench"
path = "src/bin/e2e_bench.rs"

[dependencies]
diavasi = { workspace = true, default-features = false }
diavasi-adapter-postgres = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
