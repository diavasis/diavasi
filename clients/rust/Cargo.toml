[package]
name = "diavasi-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Thin client for the Diavasi data plane"

[workspace]

[[bin]]
name = "diavasi-consume"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
