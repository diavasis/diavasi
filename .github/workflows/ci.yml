name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all --all-features
      - name: docs
        run: cargo doc --no-deps --all-features --workspace --exclude diavasi-cli --exclude diavasi-bench
        env:
          RUSTDOCFLAGS: -D warnings
      - name: package
        run: cargo publish --workspace --dry-run --locked
      - name: transport smoke tcp
        run: >
          cargo run -p diavasi --bin diavasi-transport-bench --features transport-bench --
          --transport tcp --smoke --output docs/bench/results.jsonl
      - name: transport smoke grpc
        run: >
          cargo run -p diavasi --bin diavasi-transport-bench --features transport-bench --
          --transport grpc --smoke --listen 127.0.0.1:9801 --connect 127.0.0.1:9801
          --output docs/bench/results.jsonl
      - name: transport smoke quic
        run: >
          cargo run -p diavasi --bin diavasi-transport-bench --features transport-bench --
          --transport quic --smoke --listen 127.0.0.1:9802 --connect 127.0.0.1:9802
          --output docs/bench/results.jsonl
      - name: transport smoke webtransport
        run: >
          cargo run -p diavasi --bin diavasi-transport-bench --features transport-bench --
          --transport webtransport --smoke --listen 127.0.0.1:9803 --connect 127.0.0.1:9803
          --output docs/bench/results.jsonl

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: diavasi
          POSTGRES_PASSWORD: diavasi
          POSTGRES_DB: diavasi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diavasi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 30s
          --health-start-period 40s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      scylla:
        image: scylladb/scylla:2026.1
        command: --smp 1 --memory 1G --overprovisioned 1
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'SELECT now() FROM system.local'"
          --health-interval 15s
          --health-timeout 20s
          --health-start-period 60s
          --health-retries 12
    env:
      DATABASE_URL: postgres://diavasi:diavasi@localhost:5432/diavasi
      MONGODB_URL: mongodb://127.0.0.1:27017
      REDIS_URL: redis://127.0.0.1:6379
      SCYLLA_URL: 127.0.0.1:9042
      DIAVASI_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --all --all-features
      - name: stage 7 smoke
        run: >
          cargo run -p diavasi-bench --bin diavasi-e2e-bench --
          --smoke --output /tmp/stage-07-smoke.jsonl

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate lcov
        # Exclude Stage 0 transport bake-off (heavy, untested harness). Avoid
        # --all-features so transport-bench is not compiled under instrumentation.
        run: >
          cargo llvm-cov --workspace --no-default-features
          --ignore-filename-regex 'transport_bench'
          --lcov --output-path lcov.info
      - name: Coverage summary
        run: >
          cargo llvm-cov report --summary-only
          --ignore-filename-regex 'transport_bench'
      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
          format: lcov
          fail-on-error: false

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2

  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gRPC C headers
        run: sudo apt-get update && sudo apt-get install -y libgrpc-dev pkg-config
      - name: SDK compatibility suite
        run: DIAVASI_SDK_REQUIRE=1 ./clients/scripts/compat.sh
