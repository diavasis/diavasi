name: Publish to crates.io

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # protoc comes from protoc-bin-vendored in build.rs.
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches the workspace version
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as handle:
              data = tomllib.load(handle)
          version = data["workspace"]["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match workspace version {version}")
          deps = data["workspace"]["dependencies"]
          expected = {
              "diavasi-core",
              "diavasi-adapter-postgres",
              "diavasi-adapter-mongodb",
              "diavasi-adapter-redis",
              "diavasi-adapter-scylla",
          }
          found = set()
          for key, spec in deps.items():
              if not isinstance(spec, dict) or "version" not in spec:
                  continue
              pkg = spec.get("package", key)
              if pkg not in expected:
                  continue
              found.add(pkg)
              if spec["version"] != version:
                  raise SystemExit(f"{pkg} dependency version {spec['version']} != {version}")
          missing = expected - found
          if missing:
              raise SystemExit(f"workspace.dependencies missing {sorted(missing)}")
          PY
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # A crate version already on crates.io counts as published, so a
          # rerun after a partial release continues where it stopped. Other
          # failures are retried while the index catches up with a dependency.
          publish() {
            local pkg="$1"
            local attempt log
            for attempt in 1 2 3 4 5 6; do
              log="$(mktemp)"
              if cargo publish -p "$pkg" --locked 2>&1 | tee "$log"; then
                return 0
              fi
              if grep -qiE "already (exists|uploaded)" "$log"; then
                echo "$pkg is already published"
                return 0
              fi
              echo "publish $pkg failed (attempt $attempt), waiting for the index"
              sleep 20
            done
            return 1
          }
          publish diavasi-core
          publish diavasi-adapter-postgres
          publish diavasi-adapter-mongodb
          publish diavasi-adapter-redis
          publish diavasi-adapter-scylla
          publish diavasi

  # GitHub Release assets for the diavasi executable. Independent of the
  # crates.io job above. Asset names stay prefixed `diavasi-` so mise can match them.
  package-binary:
    name: Package ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-aarch64
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: macos-aarch64
          - runner: macos-latest
            target: x86_64-apple-darwin
            asset: macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.asset }}
      - name: Check the tag matches the workspace version
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as handle:
              data = tomllib.load(handle)
          version = data["workspace"]["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match workspace version {version}")
          PY
      - name: Build
        run: |
          set -euo pipefail
          if [ "${{ matrix.asset }}" = "macos-x86_64" ]; then
            export CMAKE_OSX_ARCHITECTURES=x86_64
          fi
          cargo build --release --locked -p diavasi --target "${{ matrix.target }}"
      - name: Archive
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          install -m 755 "target/${{ matrix.target }}/release/diavasi" "${stage}/diavasi"
          # Sastri installers request diavasi-<tag>-<platform>.tar.gz.
          tar -C "${stage}" -czf "diavasi-${GITHUB_REF_NAME}-${{ matrix.asset }}.tar.gz" diavasi
      - uses: actions/upload-artifact@v4
        with:
          name: diavasi-${{ matrix.asset }}
          path: diavasi-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz

  release-assets:
    name: GitHub Release assets
    needs: package-binary
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: diavasi-*
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum diavasi-*.tar.gz | sort -k2 > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  docker-image:
    name: Publish container image
    needs: package-binary
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: diavasi-linux-x86_64
          path: image
      - name: Prepare build context
        run: |
          set -euo pipefail
          tar -xzf image/diavasi-*.tar.gz -C image
          cp clients/docker/entrypoint.sh image/entrypoint.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/diavasis/diavasi"
          docker build \
            -f clients/docker/Dockerfile.release \
            -t "${image}:${version}" \
            -t "${image}:latest" \
            image
          docker push "${image}:${version}"
          docker push "${image}:latest"
