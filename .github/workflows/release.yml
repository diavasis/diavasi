name: Publish to crates.io

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches the workspace version
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as handle:
              data = tomllib.load(handle)
          version = data["workspace"]["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match workspace version {version}")
          deps = data["workspace"]["dependencies"]
          for name in ("diavasi", "diavasi-adapter-postgres", "diavasi-adapter-mongodb", "diavasi-adapter-redis", "diavasi-adapter-scylla"):
              got = deps[name]["version"]
              if got != version:
                  raise SystemExit(f"{name} dependency version {got} != {version}")
          PY
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          publish() {
            local pkg="$1"
            local attempt
            for attempt in 1 2 3 4 5 6; do
              if cargo publish -p "$pkg" --locked; then
                return 0
              fi
              echo "publish $pkg failed (attempt $attempt), waiting for the index"
              sleep 20
            done
            return 1
          }
          publish diavasi
          publish diavasi-adapter-postgres
          publish diavasi-adapter-mongodb
          publish diavasi-adapter-redis
          publish diavasi-adapter-scylla
          publish diavasi-cli
