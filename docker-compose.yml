services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - diavasi_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: diavasi
      POSTGRES_PASSWORD: diavasi
      POSTGRES_DB: diavasi
    volumes:
      - diavasi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diavasi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  scylla:
    image: scylladb/scylla:2026.1
    command: --smp 1 --memory 1G --overprovisioned 1
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local'"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

volumes:
  diavasi_mongo_data:
  diavasi_postgres_data:
